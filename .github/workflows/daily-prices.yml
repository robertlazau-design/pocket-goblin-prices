name: Daily prices

on:
  schedule:
    # Scryfall publishes its daily bulk data around 21:00 UTC.
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the price file
        run: python build_price_file.py prices.deflate
      - name: Publish it as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --title "Latest prices" --notes "Updated daily from Scryfall."
          gh release upload latest prices.deflate --clobber
